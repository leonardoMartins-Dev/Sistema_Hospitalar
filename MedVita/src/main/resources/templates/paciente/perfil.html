<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MEDVITA - Meus Dados</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" th:href="@{/css/dashboard.css}" />
  </head>

  <body>
    <div class="dash-shell">
      <aside class="sidebar">
        <div class="sidebar-logo">
          <img th:src="@{/images/Logo.png}" alt="Logo MEDVITA" />
          <div class="sidebar-logo-text">
            <span>MEDVITA</span>
            <svg class="sidebar-pulse" viewBox="0 0 120 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M0 12h20l5-8 7 16 6-12 4 8h6l5-9 4 5h20"/></svg>
          </div>
        </div>

        <div class="sidebar-role"><span>Portal do Paciente</span></div>

        <nav class="sidebar-nav">
          <a th:href="@{/home}">
            <svg class="icon" viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-5h2v5h4a1 1 0 0 0 1-1v-9"/></svg>
            Início
          </a>

          <a th:href="@{/paciente/consultas}">
            <svg class="icon" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="15" rx="2"/><path d="M4 10h16"/><path d="M8 3.5v4"/><path d="M16 3.5v4"/></svg>
            Minhas Consultas
          </a>

          <a th:href="@{/paciente/agendar-consulta}">
            <svg class="icon" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="15" rx="2"/><path d="M4 10h16"/><path d="M8 3.5v4"/><path d="M16 3.5v4"/><path d="M12 13v5"/><path d="M9.5 15.5h5"/></svg>
            Agendar Consulta
          </a>

          <a th:href="@{/paciente/internacoes}">
            <svg class="icon" viewBox="0 0 24 24"><path d="M2 20v-9"/><path d="M2 15h20"/><path d="M2 20h20"/><path d="M22 20v-5.5a1.5 1.5 0 0 0-1.5-1.5H11v2"/><rect x="4" y="10" width="5" height="3.5" rx="1"/></svg>
            Internações
          </a>

          <a th:href="@{/paciente/historico}">
            <svg class="icon" viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="17" rx="2"/><rect x="9" y="2.5" width="6" height="3" rx="1"/><path d="M9 11h6"/><path d="M9 14.5h6"/><path d="M9 18h4"/></svg>
            Histórico Médico
          </a>

          <a th:href="@{/paciente/perfil}" class="active">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/></svg>
            Meus Dados
          </a>
        </nav>

        <div class="sidebar-footer">
          <a th:href="@{/home}" class="btn-back">
            <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
            Voltar ao Painel
          </a>
        </div>
      </aside>

      <main class="main">
        <div class="topbar">
          <div class="topbar-title">
            <span class="eyebrow">MEDVITA · Portal do Paciente</span>
            <h1>Meus Dados</h1>
            <p>Veja e revise as informações do seu cadastro.</p>
          </div>

          
        </div>

        <div class="content">
          <div class="card">
            <div class="card-header">
              <div>
                <h2>Dados pessoais</h2>
                <p>Informações utilizadas no seu cadastro e atendimentos.</p>
              </div>
            </div>

            <form>
              <div class="form-grid">
                <div class="form-group">
                  <label for="nome">Nome completo</label>
                  <input type="text" id="nome" value="Nome do Paciente" disabled />
                </div>

                <div class="form-group">
                  <label for="cpf">CPF</label>
                  <input type="text" id="cpf" value="000.000.000-00" disabled />
                </div>

                <div class="form-group">
                  <label for="nascimento">Data de nascimento</label>
                  <input type="date" id="nascimento" disabled />
                </div>

                <div class="form-group">
                  <label for="telefone">Telefone</label>
                  <input type="tel" id="telefone" value="(00) 00000-0000" disabled />
                </div>

                <div class="form-group full-width">
                  <label for="endereco">Endereço</label>
                  <input type="text" id="endereco" value="Endereço cadastrado" disabled />
                </div>

                <div class="form-group full-width">
                  <label for="email">E-mail</label>
                  <input type="email" id="email" value="paciente@email.com" disabled />
                </div>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>

spring.application.name=TelaLogin

# Carrega variáveis sensíveis do arquivo .env (não versionado)
spring.config.import=optional:file:.env[.properties]

# =========================================================
# ADMINISTRADOR
# =========================================================

# O admin NÃO fica no banco: o login dele é lido daqui.
# Pacientes se cadastram pela página /register e médicos são
# cadastrados pelo admin na página /admin/medicos (ambos no Supabase).
app.admin.username=admin
app.admin.password=1234
app.admin.name=Administrador


# =========================================================
# GMAIL
# =========================================================

# https://myaccount.google.com/apppasswords
# sua senha de app aqui (É necessário ativar a autenticação de dois fatores antes no Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


# =========================================================
# GOOGLE reCAPTCHA
# =========================================================

recaptcha.site-key=${RECAPTCHA_SITE_KEY}
recaptcha.secret-key=${RECAPTCHA_SECRET_KEY}


# =========================================================
# SUPABASE (PostgreSQL)
# =========================================================

# Use a connection string do "Session pooler" (porta 5432) em
# Supabase > Connect > Type: JDBC > Method: Session pooler.
# Os valores vêm do .env para não versionar a senha.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Pool pequeno: o plano free do Supabase limita conexões
spring.datasource.hikari.maximum-pool-size=5

# As tabelas são criadas pelo script supabase/schema.sql; o Hibernate não altera o banco
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.application.name=TelaLogin

# Carrega variáveis sensíveis do arquivo .env (não versionado).
# O caminho é relativo à pasta de onde a aplicação é executada, por isso
# procura nos dois lugares: dentro de MedVita/ (mvn spring-boot:run) e na
# raiz do repositório (botão Run do VS Code).
spring.config.import=optional:file:.env[.properties],optional:file:MedVita/.env[.properties]

# =========================================================
# ADMINISTRADOR
# =========================================================

# O admin NÃO fica no banco: o login dele é lido daqui.
# Pacientes se cadastram pela página /register e médicos são
# cadastrados pelo admin na página /admin/medicos (ambos no Supabase).
app.admin.username=admin
app.admin.password=1234
app.admin.name=Administrador


# =========================================================
# USUÁRIOS DE TESTE (TEMPORÁRIO, ENQUANTO O BANCO NÃO FUNCIONA)
# =========================================================

# Assim como o admin, NÃO ficam no banco: servem só para entrar no site
# e ver as telas do paciente e do médico sem o Supabase configurado.
# Quando o banco estiver funcionando, apague este bloco inteiro.
app.teste.paciente.username=paciente
app.teste.paciente.password=1234

app.teste.medico.username=medico
app.teste.medico.password=1234


# =========================================================
# GMAIL
# =========================================================

# https://myaccount.google.com/apppasswords
# sua senha de app aqui (É necessário ativar a autenticação de dois fatores antes no Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


# =========================================================
# GOOGLE reCAPTCHA
# =========================================================

recaptcha.site-key=${RECAPTCHA_SITE_KEY}
recaptcha.secret-key=${RECAPTCHA_SECRET_KEY}


# =========================================================
# SUPABASE (PostgreSQL)
# =========================================================

# Use a connection string do "Session pooler" (porta 5432) em
# Supabase > Connect > Type: JDBC > Method: Session pooler.
# Os valores vêm do .env para não versionar a senha.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Pool pequeno: o plano free do Supabase limita conexões
spring.datasource.hikari.maximum-pool-size=5

# As tabelas são criadas pelo script supabase/schema.sql; o Hibernate não altera o banco
spring.jpa.hibernate.ddl-auto=none
# Dialeto fixo: sem ele o Hibernate precisa conectar no banco para descobrir
# qual é, e a aplicação nem sobe quando o Supabase não está configurado
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
